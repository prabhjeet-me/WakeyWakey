name: NPM Publish

on:
  push:
    tags:
      - '@prabhjeet.me/wakeywakey-v*.*.*'

jobs:
  npm:
    runs-on: ubuntu-latest

    steps:
      # Checkout full history
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Update to specific npm version
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:wakeywakey

      - name: Publish to NPM
        working-directory: ./dist/wakeywakey
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
